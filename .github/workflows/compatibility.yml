name: Compatibility
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - if: runner.os == 'Windows'
        run: dotnet build App/MealPrepApp/MealPrepApp.csproj -c Release
      - if: runner.os == 'Windows'
        name: Install pinned Inno Setup compiler
        run: |
          choco install innosetup --version=6.4.3 --yes --no-progress --allow-downgrade
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
      - if: runner.os == 'Windows'
        run: ./scripts/build-windows.ps1
      # Run before diagnostic unit tests create the per-user MealPrepApp directory.
      - if: runner.os == 'Windows'
        run: ./scripts/test-windows-install.ps1
      - if: runner.os == 'macOS'
        run: bash scripts/build-mac.sh -m:1
      - if: runner.os == 'macOS'
        run: python3 scripts/package-release.py macos-arm64
      - if: runner.os == 'Linux'
        run: bash scripts/build-linux.sh -m:1
      - if: runner.os == 'Linux'
        run: python3 scripts/package-release.py linux-x64
      - run: dotnet test Tests/MealPrepApp.Tests/MealPrepApp.Tests.csproj -c Release --logger trx --results-directory TestResults
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.os }}
          path: TestResults/
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ runner.os }}
          path: |
            dist/release/*.tar.gz
            dist/release/*-setup.exe
            dist/release/*-setup.exe.metadata.json
          if-no-files-found: error
  presentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 Tests/Scripts/check_redesign_contrast.py
      - run: python3 Tests/Scripts/test_database_update.py
      - run: python3 Tests/Scripts/test_release_package.py
      - run: python3 Tests/Scripts/test_branch_consolidation.py
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Disposable SQL suite
        shell: bash
        run: |
          set -o pipefail
          bash scripts/test-database.sh 2>&1 | tee database-tests.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-results
          path: database-tests.log
