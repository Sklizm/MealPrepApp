name: Compatibility
on:
  push:
  pull_request:
jobs:
  desktop:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test Tests/MealPrepApp.Tests/MealPrepApp.Tests.csproj -c Release
      - if: runner.os == 'Windows'
        run: dotnet build App/MealPrepApp/MealPrepApp.csproj -c Release
      - if: runner.os == 'macOS'
        run: bash scripts/build-mac.sh
      - if: runner.os == 'Linux'
        run: bash scripts/build-linux.sh
      - name: Reject deployment credentials in output
        shell: bash
        run: |
          if find dist -name appsettings.Local.json -print -quit 2>/dev/null | grep -q .; then
            echo "Local settings leaked into publish output"
            exit 1
          fi

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 Tests/Scripts/test_database_update.py
      - run: bash scripts/test-database.sh
